name: Release Charts

on:
  push:
    branches: [main]

# Only one release can run at a time — prevent index.yaml corruption
concurrency:
  group: ${{ github.workflow }}
  cancel-in-progress: false

# Default to read-only; release job declares the elevated permissions it needs
permissions:
  contents: read

jobs:
  release:
    permissions:
      contents: write   # create GitHub Releases and push gh-pages
      packages: write   # push OCI charts to GHCR
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
        with:
          fetch-depth: 0

      - name: Configure Git
        run: |
          git config user.name "$GITHUB_ACTOR"
          git config user.email "$GITHUB_ACTOR@users.noreply.github.com"

      - name: Set up Helm
        uses: azure/setup-helm@1a275c3b69536ee54be43f2070a358922e12c8d4 # v4
        with:
          version: v3.16.0

      - name: Run chart-releaser
        uses: helm/chart-releaser-action@cae68fefc6b5f367a0275617c9f83181ba54714f # v1.7.0
        env:
          CR_TOKEN: "${{ secrets.GITHUB_TOKEN }}"
        with:
          charts_dir: charts
          config: .cr/cr.yaml
          skip_existing: true
          packages_with_index: true

      - name: Login to GHCR
        uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9 # v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Push charts to GHCR as OCI
        run: |
          shopt -s nullglob
          packages=(.cr-release-packages/*.tgz)
          if [ ${#packages[@]} -eq 0 ]; then
            echo "No new chart packages to push to GHCR — skipping"
            exit 0
          fi
          for pkg in "${packages[@]}"; do
            helm push "$pkg" "oci://ghcr.io/${{ github.repository_owner }}/charts"
          done
