name: Release Charts

on:
  push:
    branches: [main]

# Only one release can run at a time — prevent index.yaml corruption
concurrency:
  group: ${{ github.workflow }}
  cancel-in-progress: false

# Default to read-only; release job declares the elevated permissions it needs
permissions:
  contents: read

jobs:
  release:
    permissions:
      contents: write   # create GitHub Releases and push gh-pages
      packages: write   # push OCI charts to GHCR
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3
        with:
          fetch-depth: 0

      - name: Configure Git
        run: |
          git config user.name "$GITHUB_ACTOR"
          git config user.email "$GITHUB_ACTOR@users.noreply.github.com"

      - name: Set up Helm
        uses: azure/setup-helm@9bc31f4ebc9c6b171d7bfbaa5d006ae7abdb4310 # v5.0.1
        with:
          version: v3.21.2

      - name: Install chart-releaser
        run: |
          CR_VERSION="1.7.0"
          ARCH="$(uname -m | sed 's/x86_64/amd64/;s/aarch64/arm64/')"
          curl -sSL \
            "https://github.com/helm/chart-releaser/releases/download/v${CR_VERSION}/chart-releaser_${CR_VERSION}_linux_${ARCH}.tar.gz" \
            -o /tmp/cr.tar.gz
          tar -xzf /tmp/cr.tar.gz -C /usr/local/bin cr

      - name: Install Cosign
        uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6 # v4.1.2

      - name: Bootstrap gh-pages branch
        run: |
          if ! git ls-remote --exit-code origin gh-pages 2>/dev/null; then
            git worktree add --orphan -b gh-pages /tmp/gh-pages-init
            echo "charts.arieotech.com" > /tmp/gh-pages-init/CNAME
            git -C /tmp/gh-pages-init add CNAME
            git -C /tmp/gh-pages-init commit -m "Initialize Helm chart repository"
            git -C /tmp/gh-pages-init push origin gh-pages
            git worktree remove /tmp/gh-pages-init
          fi

      - name: Package charts
        run: |
          mkdir -p .cr-release-packages
          for chart in charts/*/; do
            name=$(basename "$chart")
            [ "$name" = "arieotech-lib" ] && continue
            helm dependency update "$chart" 2>/dev/null || true
            cr package "$chart" --package-path .cr-release-packages
          done

      - name: Upload charts to GitHub Releases
        run: |
          cr upload \
            --config .cr/cr.yaml \
            --token "${{ secrets.GITHUB_TOKEN }}" \
            --skip-existing \
            --package-path .cr-release-packages

      - name: Sign chart packages
        env:
          COSIGN_PRIVATE_KEY: ${{ secrets.COSIGN_PRIVATE_KEY }}
          COSIGN_PASSWORD: ${{ secrets.COSIGN_PASSWORD }}
        run: |
          shopt -s nullglob
          packages=(.cr-release-packages/*.tgz)
          if [ ${#packages[@]} -eq 0 ]; then
            echo "No packages to sign — skipping"
            exit 0
          fi
          for pkg in "${packages[@]}"; do
            cosign sign-blob \
              --key env://COSIGN_PRIVATE_KEY \
              --bundle "${pkg}.sig" \
              "$pkg"
          done

      - name: Upload signatures to GitHub Releases
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          shopt -s nullglob
          sigs=(.cr-release-packages/*.tgz.sig)
          if [ ${#sigs[@]} -eq 0 ]; then
            echo "No signatures to upload — skipping"
            exit 0
          fi
          for sig in "${sigs[@]}"; do
            tag="$(basename "${sig%.tgz.sig}")"
            echo "Uploading $(basename $sig) to release ${tag}"
            gh release upload "$tag" "$sig" --clobber --repo "${{ github.repository }}"
          done

      - name: Update index on gh-pages
        run: |
          mkdir -p .cr-index
          cr index \
            --config .cr/cr.yaml \
            --token "${{ secrets.GITHUB_TOKEN }}" \
            --push

      - name: Publish artifacthub-repo.yml to gh-pages
        run: |
          git fetch origin gh-pages
          git worktree add /tmp/gh-pages-publish gh-pages
          cp artifacthub-repo.yml /tmp/gh-pages-publish/artifacthub-repo.yml
          git -C /tmp/gh-pages-publish add artifacthub-repo.yml
          if git -C /tmp/gh-pages-publish diff --cached --quiet; then
            echo "artifacthub-repo.yml unchanged — skipping"
          else
            git -C /tmp/gh-pages-publish commit -m "Update artifacthub-repo.yml"
            git -C /tmp/gh-pages-publish push origin gh-pages
          fi
          git worktree remove /tmp/gh-pages-publish

      - name: Login to GHCR
        uses: docker/login-action@650006c6eb7dba73a995cc03b0b2d7f5ca915bee # v4.2.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Push charts to GHCR as OCI
        run: |
          shopt -s nullglob
          packages=(.cr-release-packages/*.tgz)
          if [ ${#packages[@]} -eq 0 ]; then
            echo "No new chart packages to push to GHCR — skipping"
            exit 0
          fi
          for pkg in "${packages[@]}"; do
            helm push "$pkg" "oci://ghcr.io/${{ github.repository_owner }}/charts"
          done
