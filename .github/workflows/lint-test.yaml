name: Lint and Test Charts

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

# Cancel in-progress runs on the same branch to avoid duplicate work
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

# Default to read-only; jobs that need more declare it explicitly
permissions:
  contents: read

jobs:
  lint-test:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3
        with:
          fetch-depth: 0

      - name: Set up Helm
        uses: azure/setup-helm@dda3372f752e03dde6b3237bc9431cdc2f7a02a2 # v5.0.0
        with:
          version: v3.16.0

      - name: Set up Python
        uses: actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405 # v6.2.0
        with:
          python-version: "3.12"

      - name: Set up uv
        uses: astral-sh/setup-uv@11f9893b081a58869d3b5fccaea48c9e9e46f990 # v8.3.2
        with:
          version: "0.11.16"
          enable-cache: "false"

      - name: Set up chart-testing
        uses: helm/chart-testing-action@6ec842c01de15ebb84c8627d2744a0c2f2755c9f # v2.8.0

      - name: Run chart-testing (list-changed)
        id: list-changed
        run: |
          changed=$(ct list-changed --config .ct/ct.yaml)
          if [[ -n "$changed" ]]; then
            echo "changed=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Run chart-testing (lint)
        if: steps.list-changed.outputs.changed == 'true'
        run: ct lint --config .ct/ct.yaml

      - name: Pre-pull kind node image
        if: steps.list-changed.outputs.changed == 'true'
        run: |
          IMAGE="kindest/node:v1.35.0"
          for i in 1 2 3 4 5; do
            docker pull "$IMAGE" && break
            [ $i -eq 5 ] && { echo "ERROR: failed to pull $IMAGE after 5 attempts"; exit 1; }
            echo "Attempt $i failed, retrying in 15s..."
            sleep 15
          done

      - name: Create kind cluster
        if: steps.list-changed.outputs.changed == 'true'
        uses: helm/kind-action@ef37e7f390d99f746eb8b610417061a60e82a6cc # v1.14.0
        with:
          config: test/kind-cluster/kind-config.yaml
          ## Use the standard kindest/node image (k8s v1.35.0, compatible with kind v0.31.0).
          ## Pre-pull step above handles transient Docker Hub connectivity failures with retry.
          node_image: kindest/node:v1.35.0

      - name: Bootstrap cluster prerequisites
        if: steps.list-changed.outputs.changed == 'true'
        run: test/kind-cluster/bootstrap.sh

      - name: Run chart-testing (install)
        if: steps.list-changed.outputs.changed == 'true'
        run: ct install --config .ct/ct.yaml
