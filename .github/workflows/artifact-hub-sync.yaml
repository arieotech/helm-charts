name: Sync Artifact Hub

on:
  push:
    branches: [main]
    paths:
      - "artifacthub-repo.yml"
      - "charts/**/Chart.yaml"
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  sync:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Log sync intent
        run: |
          echo "artifacthub-repo.yml or a Chart.yaml changed."
          echo "Artifact Hub auto-scans registered repos every ~30 min — no API call needed."
