name: Bug Report
description: Report a problem with a chart
labels: ["bug", "triage"]
body:
  - type: dropdown
    id: chart
    attributes:
      label: Chart
      options:
        - keycloak
        - other
    validations:
      required: true
  - type: input
    id: chart-version
    attributes:
      label: Chart version
    validations:
      required: true
  - type: input
    id: k8s-version
    attributes:
      label: Kubernetes version
    validations:
      required: true
  - type: dropdown
    id: cloud
    attributes:
      label: Cloud / distribution
      options:
        - EKS
        - GKE
        - AKS
        - Kind (local)
        - Other
  - type: textarea
    id: description
    attributes:
      label: What happened?
    validations:
      required: true
  - type: textarea
    id: values
    attributes:
      label: Relevant values.yaml excerpt
      render: yaml
  - type: textarea
    id: logs
    attributes:
      label: Error output / logs
      render: shell
