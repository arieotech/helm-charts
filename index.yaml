apiVersion: v1
entries:
  karpenter:
  - annotations:
      artifacthub.io/changes: |
        - kind: added
          description: >
            Initial release — production-grade Karpenter 1.14.0 controller. GitOps-safe CRD
            separation (upstream #6847), PSA restricted-mode, NetworkPolicy enabled by default,
            least-privilege RBAC (ClusterRole + namespaced leases/dns Roles), JSON Schema
            validation, PodDisruptionBudget, ServiceMonitor/PrometheusRule, SOC2/DPDP defaults,
            and Istio Ambient support.
      artifacthub.io/images: |
        - name: karpenter-controller
          image: public.ecr.aws/karpenter/controller:1.14.0
      artifacthub.io/license: Apache-2.0
      artifacthub.io/links: |
        - name: Karpenter documentation
          url: https://karpenter.sh/docs/
        - name: ArgoCD CRD drift rationale (upstream #6847)
          url: https://github.com/aws/karpenter-provider-aws/issues/6847
        - name: CRD companion chart
          url: https://github.com/arieotech/helm-charts/tree/main/charts/karpenter-crds
      artifacthub.io/operator: "true"
      artifacthub.io/prerelease: "false"
      artifacthub.io/recommendations: |
        - url: https://artifacthub.io/packages/helm/arieotech/karpenter-crds
    apiVersion: v2
    appVersion: 1.14.0
    created: "2026-08-13T06:54:33.966502483Z"
    dependencies:
    - name: arieotech-lib
      repository: file://../arieotech-lib
      version: 0.2.0
    description: 'Production-grade Karpenter chart for AWS/EKS node autoscaling. GitOps/ArgoCD-safe:
      CRDs are shipped in the separate karpenter-crds chart so the controller never
      embeds static CRDs that confuse ArgoCD diffing (upstream #6847). PSA restricted-mode,
      NetworkPolicy enabled by default, full JSON Schema validation, least-privilege
      RBAC, PodDisruptionBudget, ServiceMonitor/PrometheusRule, SOC2/DPDP defaults,
      and Istio Ambient Mesh support. Targets Karpenter 1.14.0 (LTS). '
    digest: 5c7541d721adaff6868d1271ef8a2be91db8311925b512a3edaf0c533c209b21
    home: https://karpenter.sh
    icon: https://raw.githubusercontent.com/aws/karpenter-provider-aws/main/website/static/banner.png
    keywords:
    - karpenter
    - autoscaling
    - node-provisioning
    - eks
    - aws
    - spot
    - cost-optimization
    - kubernetes
    maintainers:
    - email: helm@arieotech.com
      name: Arieotech
      url: https://arieotech.com
    name: karpenter
    sources:
    - https://github.com/arieotech/helm-charts/tree/main/charts/karpenter
    - https://github.com/aws/karpenter-provider-aws
    type: application
    urls:
    - https://github.com/arieotech/helm-charts/releases/download/karpenter-0.1.0/karpenter-0.1.0.tgz
    version: 0.1.0
  karpenter-crds:
  - annotations:
      artifacthub.io/changes: |
        - kind: added
          description: >
            Initial release — Karpenter 1.14.0 CRDs (NodePool, NodeClaim, NodeOverlay,
            EC2NodeClass, CapacityBuffer) as Helm-managed resources with resource-policy: keep.
            Arieotech fix for ArgoCD CRD drift (upstream #6847). Enables independent CRD
            lifecycle management for GitOps/ArgoCD workflows.
      artifacthub.io/license: Apache-2.0
      artifacthub.io/links: |
        - name: Karpenter controller chart
          url: https://github.com/arieotech/helm-charts/tree/main/charts/karpenter
        - name: ArgoCD CRD drift rationale (upstream #6847)
          url: https://github.com/aws/karpenter-provider-aws/issues/6847
        - name: Karpenter documentation
          url: https://karpenter.sh/docs/
      artifacthub.io/operator: "true"
      artifacthub.io/prerelease: "false"
      artifacthub.io/recommendations: |
        - url: https://artifacthub.io/packages/helm/arieotech/karpenter
    apiVersion: v2
    appVersion: 1.14.0
    created: "2026-08-13T06:54:34.087629581Z"
    description: 'CRD-only companion chart for Karpenter 1.14.0. Installs NodePool,
      NodeClaim, NodeOverlay (karpenter.sh/v1alpha1), EC2NodeClass (karpenter.k8s.aws/v1),
      and CapacityBuffer (autoscaling.x-k8s.io/v1beta1) as Helm-managed resources
      so they can be versioned, upgraded, and rolled back independently of the Karpenter
      controller. The Arieotech fix for ArgoCD CRD drift (upstream #6847): Karpenter''s
      own controller chart embeds static CRDs that ignore Helm values and confuse
      GitOps diffing — install this chart first, and use the Arieotech karpenter chart,
      which ships no CRDs of its own. Safe for GitOps/ArgoCD. '
    digest: 36dc45d5f4b6091065f75a7f55f4e5fcff2dd64d1c3a3ae5ef9f899cbe5ccc3e
    home: https://karpenter.sh
    icon: https://raw.githubusercontent.com/aws/karpenter-provider-aws/main/website/static/banner.png
    keywords:
    - karpenter
    - crds
    - autoscaling
    - nodepool
    - ec2nodeclass
    - gitops
    - argocd
    maintainers:
    - email: helm@arieotech.com
      name: Arieotech
      url: https://arieotech.com
    name: karpenter-crds
    sources:
    - https://github.com/arieotech/helm-charts/tree/main/charts/karpenter-crds
    - https://github.com/aws/karpenter-provider-aws
    type: application
    urls:
    - https://github.com/arieotech/helm-charts/releases/download/karpenter-crds-0.1.0/karpenter-crds-0.1.0.tgz
    version: 0.1.0
