## SOC2-hardened CI profile — tests SOC2/DPDP settings render and deploy correctly

replicaCount: 1

config:
  receivers:
    otlp:
      protocols:
        grpc:
          endpoint: "0.0.0.0:4317"
        http:
          endpoint: "0.0.0.0:4318"
  processors:
    memory_limiter:
      check_interval: 5s
      limit_percentage: 80
      spike_limit_percentage: 25
    batch:
      send_batch_size: 1000
      timeout: 5s
  exporters:
    debug:
      verbosity: normal
  extensions:
    health_check:
      endpoint: "0.0.0.0:13133"
  service:
    extensions: [health_check]
    telemetry:
      logs:
        level: "info"
        encoding: "json"
      metrics:
        readers:
          - pull:
              exporter:
                prometheus:
                  host: "0.0.0.0"
                  port: 8888
    pipelines:
      traces:
        receivers: [otlp]
        processors: [memory_limiter, batch]
        exporters: [debug]
      metrics:
        receivers: [otlp]
        processors: [memory_limiter, batch]
        exporters: [debug]
      logs:
        receivers: [otlp]
        processors: [memory_limiter, batch]
        exporters: [debug]

soc2:
  auditLogging:
    enabled: true
  enforceTLS: true

dpdp:
  dataResidency:
    enabled: true
    region: "in-mumbai"

pdb:
  enabled: false

networkPolicy:
  enabled: false

metrics:
  enabled: true
  serviceMonitor:
    enabled: false

autoscaling:
  enabled: false

resources:
  requests:
    cpu: 100m
    memory: 128Mi
  limits:
    cpu: 500m
    memory: 256Mi
