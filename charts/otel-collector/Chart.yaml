apiVersion: v2
name: otel-collector
description: >
  Production-grade OpenTelemetry Collector. Fixes the incomplete default image (upstream issue #1055),
  adds full JSON Schema validation, Istio Ambient Mesh support, PSA restricted-mode security,
  and SOC2/DPDP compliance defaults. Supports Deployment and DaemonSet modes.
type: application
version: 0.1.0
appVersion: "0.154.0"
keywords:
  - opentelemetry
  - otel
  - observability
  - tracing
  - metrics
  - logs
  - otlp
home: https://opentelemetry.io/docs/collector/
sources:
  - https://github.com/arieotech/helm-charts/tree/main/charts/otel-collector
  - https://github.com/open-telemetry/opentelemetry-collector-contrib
icon: https://opentelemetry.io/img/logos/opentelemetry-horizontal-color.svg
maintainers:
  - name: Arieotech
    email: helm@arieotech.com
    url: https://arieotech.com
dependencies:
  - name: arieotech-lib
    version: "0.2.0"
    repository: "file://../arieotech-lib"
annotations:
  artifacthub.io/license: Apache-2.0
  artifacthub.io/prerelease: "false"
  artifacthub.io/changes: |
    - kind: added
      description: Initial release — production OpenTelemetry Collector with full JSON Schema, Istio Ambient, SOC2/DPDP defaults
  artifacthub.io/images: |
    - name: otel-collector
      image: otel/opentelemetry-collector-contrib:0.154.0
  artifacthub.io/recommendations: |
    - url: https://artifacthub.io/packages/helm/arieotech/keycloak
  artifacthub.io/links: |
    - name: OpenTelemetry Collector documentation
      url: https://opentelemetry.io/docs/collector/
    - name: Upstream issue — incomplete default image
      url: https://github.com/open-telemetry/opentelemetry-helm-charts/issues/1055
