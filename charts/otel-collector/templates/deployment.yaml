{{- $workloadKind := include "otel-collector.workloadKind" . }}
apiVersion: apps/v1
kind: {{ $workloadKind }}
metadata:
  name: {{ include "otel-collector.fullname" . }}
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "otel-collector.labels" . | nindent 4 }}
spec:
  {{- if ne $workloadKind "DaemonSet" }}
  replicas: {{ .Values.replicaCount }}
  {{- end }}
  selector:
    matchLabels:
      {{- include "otel-collector.selectorLabels" . | nindent 6 }}
  {{- if ne $workloadKind "DaemonSet" }}
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxUnavailable: 1
      maxSurge: 1
  {{- else }}
  updateStrategy:
    type: RollingUpdate
    rollingUpdate:
      maxUnavailable: 1
  {{- end }}
  template:
    metadata:
      labels:
        {{- include "otel-collector.selectorLabels" . | nindent 8 }}
        {{- include "arieotech.istioAmbientLabels" . | nindent 8 }}
        {{- with .Values.podLabels }}
        {{- toYaml . | nindent 8 }}
        {{- end }}
      annotations:
        ## Trigger rolling restart on config changes
        checksum/config: {{ include (print $.Template.BasePath "/configmap.yaml") . | sha256sum }}
        {{- include "arieotech.istioExcludedPorts" . | nindent 8 }}
        {{- with .Values.podAnnotations }}
        {{- toYaml . | nindent 8 }}
        {{- end }}
        {{- if .Values.dpdp.dataResidency.enabled }}
        arieotech.io/data-residency-region: {{ .Values.dpdp.dataResidency.region | quote }}
        {{- end }}
    spec:
      {{- with .Values.global.imagePullSecrets }}
      imagePullSecrets:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      serviceAccountName: {{ include "otel-collector.serviceAccountName" . }}
      securityContext:
        {{- include "arieotech.podSecurityContext" . | nindent 8 }}
      {{- with .Values.priorityClassName }}
      priorityClassName: {{ . }}
      {{- end }}
      {{- with .Values.initContainers }}
      initContainers:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      containers:
        - name: otel-collector
          image: {{ include "arieotech.image" .Values.image | quote }}
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          securityContext:
            {{- include "arieotech.containerSecurityContext" . | nindent 12 }}
          args:
            - "--config=/conf/config.yaml"
          env:
            {{- if .Values.soc2.auditLogging.enabled }}
            - name: OTEL_LOG_LEVEL
              value: "info"
            {{- end }}
            {{- if .Values.dpdp.piiMasking.enabled }}
            - name: OTEL_REDACTION_ENABLED
              value: "true"
            {{- end }}
          ports:
            {{- if .Values.ports.otlp.enabled }}
            - name: otlp
              containerPort: {{ .Values.ports.otlp.containerPort }}
              protocol: {{ .Values.ports.otlp.protocol }}
            {{- end }}
            {{- if .Values.ports.otlpHttp.enabled }}
            - name: otlp-http
              containerPort: {{ .Values.ports.otlpHttp.containerPort }}
              protocol: {{ .Values.ports.otlpHttp.protocol }}
            {{- end }}
            {{- if .Values.ports.metrics.enabled }}
            - name: metrics
              containerPort: {{ .Values.ports.metrics.containerPort }}
              protocol: {{ .Values.ports.metrics.protocol }}
            {{- end }}
            {{- if .Values.ports.healthCheck.enabled }}
            - name: health
              containerPort: {{ .Values.ports.healthCheck.containerPort }}
              protocol: {{ .Values.ports.healthCheck.protocol }}
            {{- end }}
          livenessProbe:
            {{- toYaml .Values.livenessProbe | nindent 12 }}
          readinessProbe:
            {{- toYaml .Values.readinessProbe | nindent 12 }}
          resources:
            {{- toYaml .Values.resources | nindent 12 }}
          volumeMounts:
            ## /tmp for collector temp files (file_storage, scratch)
            - name: tmp
              mountPath: /tmp
            - name: config
              mountPath: /conf
              readOnly: true
            {{- with .Values.extraVolumeMounts }}
            {{- toYaml . | nindent 12 }}
            {{- end }}
        {{- with .Values.sidecars }}
        {{- toYaml . | nindent 8 }}
        {{- end }}
      volumes:
        - name: tmp
          emptyDir: {}
        - name: config
          configMap:
            name: {{ include "otel-collector.configMapName" . }}
            items:
              - key: config.yaml
                path: config.yaml
        {{- with .Values.extraVolumes }}
        {{- toYaml . | nindent 8 }}
        {{- end }}
      {{- with .Values.nodeSelector }}
      nodeSelector:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.tolerations }}
      tolerations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.affinity }}
      affinity:
        {{- toYaml . | nindent 8 }}
      {{- else }}
      affinity:
        podAntiAffinity:
          preferredDuringSchedulingIgnoredDuringExecution:
            - weight: 100
              podAffinityTerm:
                topologyKey: kubernetes.io/hostname
                labelSelector:
                  matchLabels:
                    {{- include "otel-collector.selectorLabels" . | nindent 20 }}
      {{- end }}
      {{- if and (ne $workloadKind "DaemonSet") .Values.topologySpreadConstraints }}
      topologySpreadConstraints:
        {{- range .Values.topologySpreadConstraints }}
        - {{ toYaml . | nindent 10 | trim }}
          labelSelector:
            matchLabels:
              {{- include "otel-collector.selectorLabels" $ | nindent 14 }}
        {{- end }}
      {{- end }}
