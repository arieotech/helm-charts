apiVersion: v1
kind: Pod
metadata:
  name: {{ printf "%s-test-connection" (include "otel-collector.fullname" .) }}
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "otel-collector.labels" . | nindent 4 }}
    helm.sh/chart-test: "true"
  annotations:
    "helm.sh/hook": test
    "helm.sh/hook-weight": "1"
    "helm.sh/hook-delete-policy": before-hook-creation,hook-succeeded
spec:
  restartPolicy: Never
  securityContext:
    runAsNonRoot: true
    runAsUser: 65534
    runAsGroup: 65534
    seccompProfile:
      type: RuntimeDefault
  containers:
    - name: test-health
      image: curlimages/curl:8.7.1
      securityContext:
        allowPrivilegeEscalation: false
        readOnlyRootFilesystem: true
        runAsNonRoot: true
        runAsUser: 65534
        capabilities:
          drop:
            - ALL
        seccompProfile:
          type: RuntimeDefault
      command:
        - /bin/sh
        - -c
        - |
          BASE_URL="http://{{ include "otel-collector.fullname" . }}.{{ .Release.Namespace }}.svc.cluster.local"

          check() {
            url="$1"; label="$2"
            i=0
            until code=$(curl -s -o /dev/null -w '%{http_code}' --max-time 10 "$url") && [ "$code" = "200" ]; do
              i=$((i+1))
              if [ $i -ge 12 ]; then
                echo "ERROR: ${label} check failed after ~120s (last result: HTTP ${code:-connection-error})"
                return 1
              fi
              echo "Attempt $i: ${label} not ready (HTTP ${code:-connection-error}), retrying in 10s..."
              sleep 10
            done
            echo "${label} check PASSED"
          }

          echo "Testing collector endpoints..."
          check "${BASE_URL}:{{ .Values.ports.healthCheck.servicePort }}/" health || exit 1
          {{- if .Values.ports.metrics.enabled }}
          check "${BASE_URL}:{{ .Values.ports.metrics.servicePort }}/metrics" metrics || exit 1

          echo "Verifying collector self-metrics are exposed..."
          if curl -s --max-time 10 "${BASE_URL}:{{ .Values.ports.metrics.servicePort }}/metrics" | grep -q "otelcol_"; then
            echo "Self-metrics (otelcol_*) PRESENT"
          else
            echo "ERROR: no otelcol_* metrics found on the metrics endpoint"
            exit 1
          fi
          {{- end }}

          echo "OTel Collector connection test PASSED"
      resources:
        requests:
          cpu: 10m
          memory: 16Mi
        limits:
          memory: 32Mi
