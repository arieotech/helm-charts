apiVersion: v2
name: arieotech-lib
description: Arieotech library chart — shared Helm helpers for security contexts, NetworkPolicy, ServiceMonitor, PDB, HPA, RBAC, and Istio Ambient Mesh
type: library
version: 0.2.0
keywords:
  - library
  - helper
  - security
  - psa
  - networkpolicy
home: https://github.com/arieotech/helm-charts
sources:
  - https://github.com/arieotech/helm-charts/tree/main/charts/arieotech-lib
maintainers:
  - name: Arieotech
    email: helm@arieotech.com
    url: https://arieotech.com
annotations:
  artifacthub.io/license: Apache-2.0
  artifacthub.io/prerelease: "true"
  artifacthub.io/changes: |
    - kind: added
      description: "arieotech.istioAmbientLabels and arieotech.istioExcludedPorts helpers for Istio Ambient Mesh pod label and ztunnel port exclusion annotation"
    - kind: added
      description: "arieotech.serviceAccountTokenVolume and arieotech.serviceAccountTokenVolumeMount helpers — explicit projected token volume for pods that disable automountServiceAccountToken but still need Kubernetes API access"
