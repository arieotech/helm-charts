## HA mode — 3 replicas, PDB, Infinispan clustering

replicaCount: 3

keycloak:
  auth:
    adminUser: admin
    adminPassword: changeme-ci-only

database:
  host: keycloak-postgresql.keycloak-ci-db.svc.cluster.local
  port: 5432
  name: keycloak
  username: keycloak
  password: changeme-ci-only

cache:
  stack: kubernetes
  owners: 2

pdb:
  enabled: true
  minAvailable: 2

autoscaling:
  enabled: false

soc2:
  enforceTLS: false

## kind CI cluster has 1 tainted control-plane + 2 workers.
## Topology spread is a production concern — disable it in CI so 3 replicas
## can schedule freely on 2 worker nodes.
topologySpreadConstraints: null
