## SOC2-hardened CI profile — tests SOC2/DPDP settings render and deploy correctly

replicaCount: 1

keycloak:
  auth:
    adminUser: admin
    adminPassword: changeme-ci-only

## PostgreSQL deployed by bootstrap.sh in keycloak-ci-db namespace
database:
  host: keycloak-postgresql.keycloak-ci-db.svc.cluster.local
  port: 5432
  name: keycloak
  username: keycloak
  password: changeme-ci-only

soc2:
  auditLogging:
    enabled: true
  enforceTLS: false

dpdp:
  piiMasking:
    enabled: true

networkPolicy:
  enabled: false

metrics:
  enabled: false

pdb:
  enabled: false
