apiVersion: v2
name: keycloak
description: >
  Production-grade Keycloak IAM. HA clustering, PSA restricted-mode,
  JSON Schema validation, SOC2 and DPDP compliance defaults.
  Uses the official quay.io/keycloak/keycloak image.
type: application
version: 0.3.1
appVersion: "26.6.2"
keywords:
  - keycloak
  - iam
  - sso
  - oidc
  - oauth2
  - identity
home: https://www.keycloak.org
sources:
  - https://github.com/arieotech/helm-charts/tree/main/charts/keycloak
  - https://github.com/keycloak/keycloak
icon: https://www.keycloak.org/resources/images/icon.svg
maintainers:
  - name: Arieotech
    email: helm@arieotech.com
    url: https://arieotech.com
dependencies:
  - name: arieotech-lib
    version: "0.1.0"
    repository: "file://../arieotech-lib"
annotations:
  artifacthub.io/license: Apache-2.0
  artifacthub.io/prerelease: "false"
  artifacthub.io/category: security
  artifacthub.io/containsSecurityUpdates: "false"
  artifacthub.io/changes: |
    - kind: added
      description: "Artifact Hub category, links, and metadata annotations"
  artifacthub.io/images: |
    - name: keycloak
      image: quay.io/keycloak/keycloak:26.6.2
  artifacthub.io/links: |
    - name: Chart source
      url: https://github.com/arieotech/helm-charts/tree/main/charts/keycloak
    - name: Keycloak project
      url: https://www.keycloak.org
    - name: Keycloak documentation
      url: https://www.keycloak.org/documentation
    - name: Arieotech
      url: https://arieotech.com
