apiVersion: v2
name: keycloak
description: >
  Production-grade Keycloak IAM. HA clustering, PSA restricted-mode,
  JSON Schema validation, SOC2 and DPDP compliance defaults.
  Uses the official quay.io/keycloak/keycloak image.
type: application
version: 0.3.3
appVersion: "26.6.2"
keywords:
  - keycloak
  - iam
  - sso
  - oidc
  - oauth2
  - identity
home: https://www.keycloak.org
sources:
  - https://github.com/arieotech/helm-charts/tree/main/charts/keycloak
  - https://github.com/keycloak/keycloak
icon: https://www.keycloak.org/resources/images/icon.svg
maintainers:
  - name: Arieotech
    email: helm@arieotech.com
    url: https://arieotech.com
dependencies:
  - name: arieotech-lib
    version: "0.1.0"
    repository: "file://../arieotech-lib"
annotations:
  artifacthub.io/license: Apache-2.0
  artifacthub.io/prerelease: "false"
  artifacthub.io/category: security
  artifacthub.io/containsSecurityUpdates: "false"
  artifacthub.io/changes: |
    - kind: fixed
      description: "readOnlyRootFilesystem crash: init-quarkus init container copies Quarkus lib to writable emptyDir"
    - kind: fixed
      description: "KC_HEALTH_ENABLED and KC_METRICS_ENABLED were missing, causing all health probes to fail"
    - kind: fixed
      description: "Management port 9000 now exposed on main Service, enabling Prometheus ServiceMonitor scraping"
    - kind: fixed
      description: "Headless service JGroups port corrected from 7600 to 7800/57800 (Keycloak 25+ default)"
    - kind: added
      description: "Full OIDC E2E smoke test: health, admin API, realm/client/user lifecycle, token flow, userinfo, refresh, logout"
  artifacthub.io/images: |
    - name: keycloak
      image: quay.io/keycloak/keycloak:26.6.2
  artifacthub.io/links: |
    - name: Chart source
      url: https://github.com/arieotech/helm-charts/tree/main/charts/keycloak
    - name: Keycloak project
      url: https://www.keycloak.org
    - name: Keycloak documentation
      url: https://www.keycloak.org/documentation
    - name: Arieotech
      url: https://arieotech.com
