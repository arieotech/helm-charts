{{- if .Values.realmImport.enabled }}
apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ include "keycloak.fullname" . }}-realm
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "keycloak.labels" . | nindent 4 }}
data:
  {{- range $name, $content := .Values.realmImport.realms }}
  {{ $name }}.json: |
    {{- tpl $content $ | nindent 4 }}
  {{- end }}
{{- end }}
