{{- if .Values.networkPolicy.enabled }}
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: {{ include "keycloak.fullname" . }}
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "keycloak.labels" . | nindent 4 }}
spec:
  podSelector:
    matchLabels:
      {{- include "keycloak.selectorLabels" . | nindent 6 }}
  policyTypes:
    - Ingress
    - Egress
  ingress:
    ## Allow HTTP/HTTPS from ingress controller
    - ports:
        - port: {{ .Values.keycloak.http.port }}
          protocol: TCP
        - port: {{ .Values.keycloak.http.httpsPort }}
          protocol: TCP
    ## Allow management port (health checks from kubelet and monitoring)
    - ports:
        - port: 9000
          protocol: TCP
    ## Allow inter-pod Infinispan clustering (JGroups — Keycloak 25+ uses 7800/57800)
    - from:
        - podSelector:
            matchLabels:
              {{- include "keycloak.selectorLabels" . | nindent 14 }}
      ports:
        - port: 7800
          protocol: TCP
        - port: 57800
          protocol: TCP
    {{- with .Values.networkPolicy.extraIngress }}
    {{- toYaml . | nindent 4 }}
    {{- end }}
  egress:
    ## Always allow DNS
    - ports:
        - port: 53
          protocol: UDP
        - port: 53
          protocol: TCP
    ## Allow PostgreSQL database
    - ports:
        - port: {{ .Values.database.port }}
          protocol: TCP
    ## Allow inter-pod Infinispan (JGroups — Keycloak 25+ uses 7800/57800)
    - to:
        - podSelector:
            matchLabels:
              {{- include "keycloak.selectorLabels" . | nindent 14 }}
      ports:
        - port: 7800
          protocol: TCP
        - port: 57800
          protocol: TCP
    {{- with .Values.networkPolicy.extraEgress }}
    {{- toYaml . | nindent 4 }}
    {{- end }}
{{- end }}
