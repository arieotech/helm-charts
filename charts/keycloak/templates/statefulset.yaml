apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: {{ include "keycloak.fullname" . }}
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "keycloak.labels" . | nindent 4 }}
spec:
  replicas: {{ .Values.replicaCount }}
  selector:
    matchLabels:
      {{- include "keycloak.selectorLabels" . | nindent 6 }}
  serviceName: {{ include "keycloak.fullname" . }}-headless
  podManagementPolicy: Parallel
  updateStrategy:
    type: RollingUpdate
  template:
    metadata:
      labels:
        {{- include "keycloak.selectorLabels" . | nindent 8 }}
        {{- with .Values.podLabels }}
        {{- toYaml . | nindent 8 }}
        {{- end }}
      annotations:
        checksum/secret-admin: {{ include (print $.Template.BasePath "/secret.yaml") . | sha256sum }}
        {{- if .Values.realmImport.enabled }}
        checksum/configmap-realm: {{ include (print $.Template.BasePath "/configmap-realm.yaml") . | sha256sum }}
        {{- end }}
        {{- with .Values.podAnnotations }}
        {{- toYaml . | nindent 8 }}
        {{- end }}
    spec:
      {{- with .Values.global.imagePullSecrets }}
      imagePullSecrets:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      serviceAccountName: {{ include "keycloak.serviceAccountName" . }}
      securityContext:
        {{- include "arieotech.podSecurityContext" . | nindent 8 }}
      terminationGracePeriodSeconds: {{ .Values.terminationGracePeriodSeconds }}
      {{- with .Values.priorityClassName }}
      priorityClassName: {{ . }}
      {{- end }}
      {{- if not .Values.skipInitContainers }}
      {{- if or .Values.dbchecker.enabled .Values.initContainers }}
      initContainers:
        {{- if .Values.dbchecker.enabled }}
        - name: dbchecker
          image: "{{ .Values.dbchecker.image.repository }}:{{ .Values.dbchecker.image.tag }}"
          imagePullPolicy: {{ .Values.dbchecker.image.pullPolicy }}
          securityContext:
            {{- toYaml .Values.dbchecker.securityContext | nindent 12 }}
          command:
            - sh
            - -c
            - |
              echo 'Waiting for PostgreSQL to become ready...'
              until nc -z -w 2 {{ .Values.database.host | quote }} {{ .Values.database.port }}; do
                sleep 2
              done
              echo 'PostgreSQL ready ✓'
          resources:
            {{- toYaml .Values.dbchecker.resources | nindent 12 }}
        {{- end }}
        {{- with .Values.initContainers }}
        {{- toYaml . | nindent 8 }}
        {{- end }}
      {{- end }}
      {{- end }}
      containers:
        - name: keycloak
          image: {{ include "arieotech.image" .Values.image | quote }}
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          securityContext:
            {{- include "arieotech.containerSecurityContext" . | nindent 12 }}
          args:
            - start
            {{- if .Values.realmImport.enabled }}
            - --import-realm
            {{- end }}
          env:
            - name: KC_HTTP_PORT
              value: {{ .Values.keycloak.http.port | quote }}
            - name: KC_HTTPS_PORT
              value: {{ .Values.keycloak.http.httpsPort | quote }}
            - name: KC_HTTP_RELATIVE_PATH
              value: {{ .Values.keycloak.http.relativePath | quote }}
            ## Proxy and hostname
            - name: KC_PROXY_HEADERS
              value: {{ .Values.proxy.mode | quote }}
            - name: KC_HOSTNAME_STRICT
              value: {{ .Values.proxy.hostnameStrict | quote }}
            {{- if .Values.proxy.http.enabled }}
            - name: KC_HTTP_ENABLED
              value: "true"
            {{- end }}
            ## Database
            - name: KC_DB
              value: {{ .Values.database.vendor | quote }}
            - name: KC_DB_URL_HOST
              value: {{ .Values.database.host | quote }}
            - name: KC_DB_URL_PORT
              value: {{ .Values.database.port | quote }}
            - name: KC_DB_URL_DATABASE
              value: {{ .Values.database.name | quote }}
            - name: KC_DB_USERNAME
              value: {{ .Values.database.username | quote }}
            - name: KC_DB_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: {{ include "keycloak.databaseSecretName" . }}
                  key: {{ .Values.database.existingSecretKey | default "db-password" }}
            ## Admin credentials
            - name: KEYCLOAK_ADMIN
              value: {{ .Values.keycloak.auth.adminUser | quote }}
            - name: KEYCLOAK_ADMIN_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: {{ include "keycloak.adminSecretName" . }}
                  key: {{ .Values.keycloak.auth.existingSecretKey | default "admin-password" }}
            ## Clustering
            - name: KC_CACHE
              value: ispn
            - name: KC_CACHE_STACK
              value: {{ .Values.cache.stack | quote }}
            - name: KC_CACHE_OWNERS_COUNT
              value: {{ .Values.cache.owners | quote }}
            - name: jgroups.dns.query
              value: {{ printf "%s-headless.%s.svc.cluster.local" (include "keycloak.fullname" .) .Release.Namespace | quote }}
            ## Features (token-exchange, admin-fine-grained-authz, etc.)
            {{- $features := list }}
            {{- if .Values.keycloak.features.tokenExchange }}
            {{- $features = append $features "token-exchange" }}
            {{- end }}
            {{- if .Values.keycloak.features.adminFineGrainedAuthz }}
            {{- $features = append $features "admin-fine-grained-authz" }}
            {{- end }}
            {{- if $features }}
            - name: KC_FEATURES
              value: {{ join "," $features | quote }}
            {{- end }}
            ## JVM tuning
            - name: JAVA_OPTS_APPEND
              value: {{ .Values.keycloak.javaOpts | quote }}
            ## SOC2: structured audit logging
            {{- if .Values.soc2.auditLogging.enabled }}
            - name: KC_LOG_CONSOLE_FORMAT
              value: "%d{yyyy-MM-dd HH:mm:ss,SSS} %-5p [%c] (%t) %s%e%n"
            - name: KC_LOG_LEVEL
              value: "INFO"
            {{- end }}
            {{- with .Values.keycloak.extraEnv }}
            {{- toYaml . | nindent 12 }}
            {{- end }}
          ports:
            - name: http
              containerPort: {{ .Values.keycloak.http.port }}
              protocol: TCP
            - name: https
              containerPort: {{ .Values.keycloak.http.httpsPort }}
              protocol: TCP
            - name: management
              containerPort: 9000
              protocol: TCP
          livenessProbe:
            {{- toYaml .Values.livenessProbe | nindent 12 }}
          readinessProbe:
            {{- toYaml .Values.readinessProbe | nindent 12 }}
          startupProbe:
            {{- toYaml .Values.startupProbe | nindent 12 }}
          resources:
            {{- toYaml .Values.resources | nindent 12 }}
          volumeMounts:
            - name: tmp
              mountPath: /tmp
            - name: data
              mountPath: /opt/keycloak/data
            {{- if .Values.realmImport.enabled }}
            - name: realm-import
              mountPath: /opt/keycloak/data/import
              readOnly: true
            {{- end }}
            {{- with .Values.extraVolumeMounts }}
            {{- toYaml . | nindent 12 }}
            {{- end }}
        {{- with .Values.sidecars }}
        {{- toYaml . | nindent 8 }}
        {{- end }}
      volumes:
        - name: tmp
          emptyDir: {}
        - name: data
          emptyDir: {}
        {{- if .Values.realmImport.enabled }}
        - name: realm-import
          configMap:
            name: {{ include "keycloak.fullname" . }}-realm
        {{- end }}
        {{- with .Values.extraVolumes }}
        {{- toYaml . | nindent 8 }}
        {{- end }}
      {{- with .Values.nodeSelector }}
      nodeSelector:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.tolerations }}
      tolerations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.affinity }}
      affinity:
        {{- toYaml . | nindent 8 }}
      {{- else }}
      affinity:
        podAntiAffinity:
          preferredDuringSchedulingIgnoredDuringExecution:
            - weight: 100
              podAffinityTerm:
                topologyKey: kubernetes.io/hostname
                labelSelector:
                  matchLabels:
                    {{- include "keycloak.selectorLabels" . | nindent 20 }}
      {{- end }}
      {{- with .Values.topologySpreadConstraints }}
      topologySpreadConstraints:
        {{- range . }}
        - {{ toYaml . | nindent 10 | trim }}
          labelSelector:
            matchLabels:
              {{- include "keycloak.selectorLabels" $ | nindent 14 }}
        {{- end }}
      {{- end }}
