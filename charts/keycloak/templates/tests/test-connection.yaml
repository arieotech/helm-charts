apiVersion: v1
kind: Pod
metadata:
  name: {{ printf "%s-test-connection" (include "keycloak.fullname" .) }}
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "keycloak.labels" . | nindent 4 }}
  annotations:
    "helm.sh/hook": test
    "helm.sh/hook-delete-policy": before-hook-creation,hook-succeeded
spec:
  restartPolicy: Never
  securityContext:
    runAsNonRoot: true
    runAsUser: 65534
    seccompProfile:
      type: RuntimeDefault
  containers:
    - name: wget
      image: busybox:1.36.1
      securityContext:
        allowPrivilegeEscalation: false
        readOnlyRootFilesystem: true
        capabilities:
          drop:
            - ALL
      command:
        - sh
        - -c
        - |
          URL="http://{{ include "keycloak.fullname" . }}:{{ .Values.service.port }}{{ .Values.keycloak.http.relativePath }}"
          i=0
          until wget -q --spider --timeout=10 "$URL"; do
            i=$((i+1))
            [ $i -ge 6 ] && echo "FAIL: timed out after 60s" && exit 1
            echo "Attempt $i failed, retrying in 10s..."
            sleep 10
          done
          echo "Connection successful"
