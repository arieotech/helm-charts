apiVersion: apiextensions.k8s.io/v1
kind: CustomResourceDefinition
metadata:
  name: cloudeventsources.eventing.keda.sh
  annotations:
    controller-gen.kubebuilder.io/version: v0.16.5
    {{- include "keda-crds.annotations" . | nindent 4 }}
  labels:
    {{- include "keda-crds.labels" . | nindent 4 }}
spec:
  group: eventing.keda.sh
  names:
    kind: CloudEventSource
    listKind: CloudEventSourceList
    plural: cloudeventsources
    singular: cloudeventsource
  scope: Namespaced
  versions:
    - name: v1alpha1
      served: true
      storage: true
      subresources:
        status: {}
      additionalPrinterColumns:
        - name: Active
          type: string
          jsonPath: .status.conditions[?(@.type=="Active")].status
        - name: Age
          type: date
          jsonPath: .metadata.creationTimestamp
      schema:
        openAPIV3Schema:
          type: object
          properties:
            apiVersion:
              type: string
            kind:
              type: string
            metadata:
              type: object
            spec:
              type: object
              required:
                - destination
              properties:
                clusterName:
                  type: string
                destination:
                  type: object
                  properties:
                    azureEventGridTopic:
                      type: object
                      properties:
                        endpoint:
                          type: string
                        authenticationRef:
                          type: object
                          properties:
                            name:
                              type: string
                            kind:
                              type: string
                    http:
                      type: object
                      properties:
                        uri:
                          type: string
                eventSubscription:
                  type: object
                  properties:
                    includedEventTypes:
                      type: array
                      items:
                        type: string
                    excludedEventTypes:
                      type: array
                      items:
                        type: string
            status:
              type: object
              x-kubernetes-preserve-unknown-fields: true
