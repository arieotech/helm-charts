## SOC2-hardened CI profile — tests SOC2/DPDP settings render and deploy correctly

replicaCount: 1

config:
  model_list:
    - model_name: test-model
      litellm_params:
        model: openai/gpt-4o-mini
        api_key: "os.environ/OPENAI_API_KEY"
  general_settings:
    master_key: "os.environ/LITELLM_MASTER_KEY"
    store_model_in_db: false
  router_settings:
    routing_strategy: simple-shuffle
    redis_host: ""
    redis_port: 6379
  litellm_settings:
    drop_params: true

masterKey:
  value: "sk-ci-test-only"

soc2:
  auditLogging:
    enabled: true
  enforceTLS: true

dpdp:
  piiMasking:
    enabled: true
    scrubFields:
      - email
      - phone_number
      - ip_address
      - credit_card_number
  dataResidency:
    enabled: true
    region: "in-mumbai"

networkPolicy:
  enabled: false

metrics:
  enabled: false

pdb:
  enabled: false
