apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ include "litellm.configMapName" . }}
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "litellm.labels" . | nindent 4 }}
data:
  config.yaml: |
    ## LiteLLM Proxy configuration
    ## Generated by Arieotech Helm chart — do not edit manually.

    model_list:
      {{- toYaml .Values.config.model_list | nindent 6 }}

    general_settings:
      {{- toYaml .Values.config.general_settings | nindent 6 }}
      {{- if .Values.database.enabled }}
      database_url: "os.environ/DATABASE_URL"
      {{- end }}

    router_settings:
      {{- toYaml .Values.config.router_settings | nindent 6 }}
      {{- if .Values.redis.enabled }}
      redis_host: {{ .Values.redis.host | quote }}
      redis_port: {{ .Values.redis.port }}
      {{- end }}

    litellm_settings:
      {{- toYaml .Values.config.litellm_settings | nindent 6 }}
      {{- if .Values.dpdp.piiMasking.enabled }}
      ## DPDP: enable redaction guardrails
      redact_messages_in_exceptions: true
      {{- end }}
      ## SOC2: structured JSON logging
      json_logs: {{ .Values.soc2.auditLogging.enabled }}
