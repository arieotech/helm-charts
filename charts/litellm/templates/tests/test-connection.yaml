apiVersion: v1
kind: Pod
metadata:
  name: {{ include "litellm.fullname" . }}-test-connection
  namespace: {{ .Release.Namespace }}
  ## Deliberately NOT the shared chart labels: the selector labels
  ## (app.kubernetes.io/name + instance) would make this test pod match the
  ## workload's Service selector (becoming a broken endpoint) and the
  ## NetworkPolicy podSelector (whose egress allow-list would drop the
  ## test's own traffic to the LiteLLM ports).
  labels:
    helm.sh/chart: {{ include "litellm.chart" . }}
    app.kubernetes.io/managed-by: {{ .Release.Service }}
    app.kubernetes.io/part-of: litellm
    app.kubernetes.io/component: test
    helm.sh/chart-test: "true"
  annotations:
    "helm.sh/hook": test
    "helm.sh/hook-weight": "1"
    "helm.sh/hook-delete-policy": before-hook-creation,hook-succeeded
spec:
  restartPolicy: Never
  securityContext:
    runAsNonRoot: true
    runAsUser: 65534
    runAsGroup: 65534
    seccompProfile:
      type: RuntimeDefault
  containers:
    - name: test-health
      image: curlimages/curl:8.7.1
      securityContext:
        allowPrivilegeEscalation: false
        readOnlyRootFilesystem: true
        runAsNonRoot: true
        runAsUser: 65534
        capabilities:
          drop:
            - ALL
        seccompProfile:
          type: RuntimeDefault
      command:
        - /bin/sh
        - -c
        - |
          BASE_URL="http://{{ include "litellm.fullname" . }}.{{ .Release.Namespace }}.svc.cluster.local:{{ .Values.service.port }}"

          check() {
            path="$1"; label="$2"
            i=0
            until code=$(curl -s -o /dev/null -w '%{http_code}' --max-time 10 "${BASE_URL}${path}") && [ "$code" = "200" ]; do
              i=$((i+1))
              if [ $i -ge 12 ]; then
                echo "ERROR: ${label} check failed after ~120s (last result: HTTP ${code:-connection-error})"
                return 1
              fi
              echo "Attempt $i: ${label} not ready (HTTP ${code:-connection-error}), retrying in 10s..."
              sleep 10
            done
            echo "${label} check PASSED"
          }

          echo "Testing LiteLLM health endpoints..."
          check /health/liveliness liveliness || exit 1
          check /health/readiness readiness || exit 1

          echo "Testing LiteLLM /models endpoint (401 expected without auth)..."
          code=$(curl -s -o /dev/null -w '%{http_code}' --max-time 10 "${BASE_URL}/models")
          echo "/models returned HTTP ${code:-connection-error} (informational only)"

          echo "LiteLLM connection test PASSED"
      resources:
        requests:
          cpu: 10m
          memory: 16Mi
        limits:
          memory: 32Mi
