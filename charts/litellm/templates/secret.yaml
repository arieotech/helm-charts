{{- if not .Values.masterKey.existingSecret }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ include "litellm.fullname" . }}-master-key
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "litellm.labels" . | nindent 4 }}
  annotations:
    ## This Secret was generated from values.masterKey.value
    ## For production: use masterKey.existingSecret pointing to an externally managed Secret
    helm.sh/resource-policy: keep
type: Opaque
stringData:
  master-key: {{ required "masterKey.value is required when not using masterKey.existingSecret" .Values.masterKey.value | quote }}
{{- end }}
{{- /* Redis secret */}}
{{- if and .Values.redis.enabled (not .Values.redis.existingSecret) .Values.redis.password }}
---
apiVersion: v1
kind: Secret
metadata:
  name: {{ include "litellm.fullname" . }}-redis
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "litellm.labels" . | nindent 4 }}
  annotations:
    helm.sh/resource-policy: keep
type: Opaque
stringData:
  redis-password: {{ .Values.redis.password | quote }}
{{- end }}
{{- /* Database secret */}}
{{- if and .Values.database.enabled (not .Values.database.existingSecret) .Values.database.connectionString }}
---
apiVersion: v1
kind: Secret
metadata:
  name: {{ include "litellm.fullname" . }}-database
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "litellm.labels" . | nindent 4 }}
  annotations:
    helm.sh/resource-policy: keep
type: Opaque
stringData:
  database-url: {{ .Values.database.connectionString | quote }}
{{- end }}
