## HA values for a multi-node production cluster.
## Assumes 3+ nodes and Prometheus Operator installed.

operator:
  replicaCount: 2
  watchNamespace: ""  # cluster-wide in this profile
  logEncoder: "json"
  logLevel: "info"

metricsApiServer:
  replicaCount: 2

admissionWebhooks:
  ## Left disabled here too: ct generates a random namespace per test run, so there's
  ## no way to pre-provision a namespace-scoped Certificate/Secret for the webhook TLS
  ## cert this profile would otherwise need. Testing the real webhook+TLS path needs
  ## either a chart-generated self-signed cert (see the CHANGELOG "known follow-up")
  ## or a values profile with a real caBundle, neither of which exist yet.
  enabled: false
  replicaCount: 2

pdb:
  enabled: true
  minAvailable: 1

networkPolicy:
  enabled: true

metrics:
  enabled: true
  serviceMonitor:
    enabled: true
    interval: "30s"
  prometheusRule:
    enabled: true

soc2:
  auditLogging:
    enabled: true

dpdp:
  dataResidency:
    enabled: false

topologySpreadConstraints:
  - maxSkew: 1
    topologyKey: kubernetes.io/hostname
    whenUnsatisfiable: DoNotSchedule
  - maxSkew: 1
    topologyKey: topology.kubernetes.io/zone
    whenUnsatisfiable: ScheduleAnyway
