## HA values for a multi-node production cluster.
## Assumes 3+ nodes and Prometheus Operator installed.

operator:
  replicaCount: 2
  watchNamespace: ""  # cluster-wide in this profile
  logEncoder: "json"
  logLevel: "info"

metricsApiServer:
  replicaCount: 2

admissionWebhooks:
  enabled: true
  replicaCount: 2

pdb:
  enabled: true
  minAvailable: 1

networkPolicy:
  enabled: true

metrics:
  enabled: true
  serviceMonitor:
    enabled: true
    interval: "30s"
  prometheusRule:
    enabled: true

soc2:
  auditLogging:
    enabled: true
  enforceTLS: true

dpdp:
  piiMasking:
    enabled: false
  dataResidency:
    enabled: false

topologySpreadConstraints:
  - maxSkew: 1
    topologyKey: kubernetes.io/hostname
    whenUnsatisfiable: DoNotSchedule
  - maxSkew: 1
    topologyKey: topology.kubernetes.io/zone
    whenUnsatisfiable: ScheduleAnyway
