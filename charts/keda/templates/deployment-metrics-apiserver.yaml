apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "keda.fullname" . }}-metrics-apiserver
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "keda.labels" . | nindent 4 }}
    app.kubernetes.io/component: metrics-apiserver
spec:
  replicas: {{ .Values.metricsApiServer.replicaCount }}
  selector:
    matchLabels:
      {{- include "keda.metricsSelectorLabels" . | nindent 6 }}
  template:
    metadata:
      labels:
        {{- include "keda.metricsSelectorLabels" . | nindent 8 }}
        {{- include "arieotech.istioAmbientLabels" . | nindent 8 }}
        {{- with .Values.podLabels }}
        {{- toYaml . | nindent 8 }}
        {{- end }}
      annotations:
        {{- include "arieotech.istioExcludedPorts" . | nindent 8 }}
        {{- if .Values.dpdp.dataResidency.enabled }}
        dpdp.arieotech.com/data-residency-region: {{ .Values.dpdp.dataResidency.region | quote }}
        {{- end }}
        {{- with .Values.podAnnotations }}
        {{- toYaml . | nindent 8 }}
        {{- end }}
    spec:
      {{- with .Values.global.imagePullSecrets }}
      imagePullSecrets:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      serviceAccountName: {{ include "keda.serviceAccountName" . }}
      automountServiceAccountToken: false
      securityContext:
        {{- include "arieotech.podSecurityContext" . | nindent 8 }}
      terminationGracePeriodSeconds: {{ .Values.terminationGracePeriodSeconds }}
      {{- with .Values.priorityClassName }}
      priorityClassName: {{ . }}
      {{- end }}
      containers:
        - name: keda-metrics-apiserver
          image: {{ include "keda.componentImage" .Values.metricsApiServer.image | quote }}
          imagePullPolicy: {{ .Values.metricsApiServer.image.pullPolicy }}
          command:
            - /keda-adapter
          args:
            - --secure-port={{ .Values.metricsApiServer.port }}
            - --logtostderr=true
            - --v={{ .Values.metricsApiServer.logLevel }}
          env:
            - name: KEDA_HTTP_DEFAULT_TIMEOUT
              value: "3000"
            - name: KEDA_HTTP_MIN_TLS_VERSION
              value: "TLS12"
            - name: POD_NAMESPACE
              valueFrom:
                fieldRef:
                  fieldPath: metadata.namespace
            {{- with .Values.metricsApiServer.extraEnv }}
            {{- toYaml . | nindent 12 }}
            {{- end }}
          ports:
            - name: https
              containerPort: {{ .Values.metricsApiServer.port }}
              protocol: TCP
            - name: health
              containerPort: 8080
              protocol: TCP
            - name: metrics
              containerPort: 9022
              protocol: TCP
          livenessProbe:
            httpGet:
              path: /healthz
              port: health
            initialDelaySeconds: 5
            periodSeconds: 10
            timeoutSeconds: 5
            failureThreshold: 3
          readinessProbe:
            httpGet:
              path: /readyz
              port: health
            initialDelaySeconds: 5
            periodSeconds: 3
            timeoutSeconds: 3
            failureThreshold: 3
          securityContext:
            {{- include "arieotech.containerSecurityContext" . | nindent 12 }}
          resources:
            {{- toYaml .Values.metricsApiServer.resources | nindent 12 }}
          volumeMounts:
            - name: tmp
              mountPath: /tmp
            {{- include "arieotech.serviceAccountTokenVolumeMount" . | nindent 12 }}
            {{- with .Values.extraVolumeMounts }}
            {{- toYaml . | nindent 12 }}
            {{- end }}
      volumes:
        - name: tmp
          emptyDir: {}
        {{- include "arieotech.serviceAccountTokenVolume" . | nindent 8 }}
        {{- with .Values.extraVolumes }}
        {{- toYaml . | nindent 8 }}
        {{- end }}
      {{- with .Values.nodeSelector }}
      nodeSelector:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.tolerations }}
      tolerations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.affinity }}
      affinity:
        {{- toYaml . | nindent 8 }}
      {{- else }}
      affinity:
        podAntiAffinity:
          preferredDuringSchedulingIgnoredDuringExecution:
            - weight: 100
              podAffinityTerm:
                topologyKey: kubernetes.io/hostname
                labelSelector:
                  matchLabels:
                    {{- include "keda.metricsSelectorLabels" . | nindent 20 }}
      {{- end }}
      {{- with .Values.topologySpreadConstraints }}
      topologySpreadConstraints:
        {{- range . }}
        - {{ toYaml . | nindent 10 | trim }}
          labelSelector:
            matchLabels:
              {{- include "keda.metricsSelectorLabels" $ | nindent 14 }}
        {{- end }}
      {{- end }}
