{{- if .Values.admissionWebhooks.enabled }}
## Service for the KEDA Admission Webhooks.
## The ValidatingWebhookConfiguration routes to this Service on port 9443.
apiVersion: v1
kind: Service
metadata:
  name: {{ include "keda.fullname" . }}-admission-webhooks
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "keda.labels" . | nindent 4 }}
    app.kubernetes.io/component: admission-webhooks
spec:
  type: ClusterIP
  selector:
    {{- include "keda.webhooksSelectorLabels" . | nindent 4 }}
  ports:
    - name: webhook
      port: {{ .Values.admissionWebhooks.port }}
      targetPort: webhook
      protocol: TCP
    - name: health
      port: 8080
      targetPort: health
      protocol: TCP
    {{- if .Values.metrics.enabled }}
    - name: metrics
      port: 8081
      targetPort: metrics
      protocol: TCP
    {{- end }}
{{- end }}
