## ClusterRole for the KEDA operator.
## RBAC granted here is always cluster-wide, regardless of .Values.operator.watchNamespace —
## Kubernetes RBAC has no concept of "these permissions, but only in these namespaces" via a
## ClusterRoleBinding. watchNamespace (Arieotech fix for upstream #5943) restricts what the
## operator's own controller-runtime cache/informers actually watch and reconcile; it is a
## reconciliation-scope control, not an RBAC boundary. Do not treat it as a security isolation
## mechanism between tenants sharing this operator.
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: {{ include "keda.fullname" . }}-operator
  labels:
    {{- include "keda.labels" . | nindent 4 }}
    app.kubernetes.io/component: operator
## Matches the upstream KEDA 2.16.0 operator ClusterRole verb-for-verb
## (github.com/kedacore/keda config/rbac/role.yaml @ v2.16.0) — the operator does not
## create/delete most of these resources itself, only reconciles/patches status and
## finalizers on what it owns. Write access to Secrets and Leases is granted only
## within this chart's own release namespace via the Role below, matching upstream's
## namespaced keda-operator Role — not cluster-wide.
rules:
  - apiGroups: [""]
    resources:
      - configmaps
      - configmaps/status
      - pods
      - secrets
      - services
    verbs: ["get", "list", "watch"]
  - apiGroups: [""]
    resources:
      - events
    verbs: ["create", "patch"]
  - apiGroups: [""]
    resources:
      - serviceaccounts
    verbs: ["list", "watch"]

  ## Generic read on any resource, plus generic scale-subresource access, covers
  ## arbitrary ScaleTarget kinds KEDA doesn't know about ahead of time.
  - apiGroups: ["*"]
    resources: ["*"]
    verbs: ["get"]
  - apiGroups: ["*"]
    resources: ["*/scale"]
    verbs: ["get", "list", "patch", "update", "watch"]

  - apiGroups: ["admissionregistration.k8s.io"]
    resources:
      - validatingwebhookconfigurations
    verbs: ["get", "list", "patch", "update", "watch"]

  - apiGroups: ["apiregistration.k8s.io"]
    resources:
      - apiservices
    verbs: ["get", "list", "patch", "update", "watch"]

  - apiGroups: ["apps"]
    resources:
      - deployments
      - statefulsets
    verbs: ["list", "watch"]

  ## Horizontal Pod Autoscaler
  - apiGroups: ["autoscaling"]
    resources:
      - horizontalpodautoscalers
    verbs: ["get", "list", "watch", "create", "update", "patch", "delete"]

  ## Batch resources (ScaledJob)
  - apiGroups: ["batch"]
    resources:
      - jobs
    verbs: ["get", "list", "watch", "create", "update", "patch", "delete"]

  ## CloudEventSource custom resources
  - apiGroups: ["eventing.keda.sh"]
    resources:
      - cloudeventsources
      - cloudeventsources/status
      - clustercloudeventsources
      - clustercloudeventsources/status
    verbs: ["get", "list", "patch", "update", "watch"]

  ## KEDA custom resources
  - apiGroups: ["keda.sh"]
    resources:
      - scaledobjects
      - scaledobjects/status
      - scaledobjects/finalizers
      - scaledjobs
      - scaledjobs/status
      - scaledjobs/finalizers
      - triggerauthentications
      - triggerauthentications/status
      - clustertriggerauthentications
      - clustertriggerauthentications/status
    verbs: ["get", "list", "patch", "update", "watch"]

  ## CRD introspection (Arieotech addition for dynamic validation — not in upstream)
  - apiGroups: ["apiextensions.k8s.io"]
    resources:
      - customresourcedefinitions
    verbs: ["get", "list", "watch"]
---
## Role for the KEDA operator, scoped to this chart's own release namespace — matches
## upstream's namespaced keda-operator Role. The ClusterRole above only grants
## cluster-wide READ on Secrets (TriggerAuthentication resolution may reference Secrets
## in other namespaces); write access to Secrets and Leases is intentionally namespace-
## scoped, since the operator only needs to write its own leader-election Lease and any
## Secrets it manages itself.
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: {{ include "keda.fullname" . }}-operator
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "keda.labels" . | nindent 4 }}
    app.kubernetes.io/component: operator
rules:
  - apiGroups: [""]
    resources:
      - secrets
    verbs: ["get", "list", "watch", "create", "update", "patch", "delete"]
  - apiGroups: ["coordination.k8s.io"]
    resources:
      - leases
    verbs: ["get", "list", "watch", "create", "update", "patch", "delete"]
---
## ClusterRole for the KEDA Metrics API Server.
## Needs access to resource metrics for the External Metrics API.
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: {{ include "keda.fullname" . }}-metrics-apiserver
  labels:
    {{- include "keda.labels" . | nindent 4 }}
    app.kubernetes.io/component: metrics-apiserver
rules:
  - apiGroups: [""]
    resources:
      - namespaces
      - pods
      - nodes
      - nodes/stats
    verbs: ["get", "list", "watch"]

  - apiGroups: ["keda.sh"]
    resources:
      - scaledobjects
      - triggerauthentications
      - clustertriggerauthentications
    verbs: ["get", "list", "watch"]

  - apiGroups: ["external.metrics.k8s.io"]
    resources: ["*"]
    verbs: ["get", "list", "watch"]

  - apiGroups: ["metrics.k8s.io"]
    resources:
      - pods
      - nodes
    verbs: ["get", "list", "watch"]

  ## Secret access for TriggerAuthentication resolution
  - apiGroups: [""]
    resources: ["secrets"]
    verbs: ["get", "list", "watch"]
{{- if .Values.admissionWebhooks.enabled }}
---
## ClusterRole for the KEDA Admission Webhooks component.
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: {{ include "keda.fullname" . }}-admission-webhooks
  labels:
    {{- include "keda.labels" . | nindent 4 }}
    app.kubernetes.io/component: admission-webhooks
rules:
  - apiGroups: ["keda.sh"]
    resources:
      - scaledobjects
      - scaledjobs
      - triggerauthentications
      - clustertriggerauthentications
    verbs: ["get", "list", "watch"]

  - apiGroups: ["admissionregistration.k8s.io"]
    resources:
      - validatingwebhookconfigurations
      - mutatingwebhookconfigurations
    verbs: ["get", "list", "watch", "create", "update", "patch", "delete"]
{{- end }}
