## ClusterRole for the KEDA operator.
## RBAC granted here is always cluster-wide, regardless of .Values.operator.watchNamespace —
## Kubernetes RBAC has no concept of "these permissions, but only in these namespaces" via a
## ClusterRoleBinding. watchNamespace (Arieotech fix for upstream #5943) restricts what the
## operator's own controller-runtime cache/informers actually watch and reconcile; it is a
## reconciliation-scope control, not an RBAC boundary. Do not treat it as a security isolation
## mechanism between tenants sharing this operator.
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: {{ include "keda.fullname" . }}-operator
  labels:
    {{- include "keda.labels" . | nindent 4 }}
    app.kubernetes.io/component: operator
rules:
  ## Core resources the operator reads/writes for autoscaling
  - apiGroups: [""]
    resources:
      - configmaps
      - configmaps/status
      - events
      - pods
      - pods/log
      - secrets
      - serviceaccounts
      - services
    verbs: ["get", "list", "watch", "create", "update", "patch", "delete"]

  ## Horizontal Pod Autoscaler
  - apiGroups: ["autoscaling"]
    resources:
      - horizontalpodautoscalers
    verbs: ["get", "list", "watch", "create", "update", "patch", "delete"]

  ## KEDA custom resources
  - apiGroups: ["keda.sh"]
    resources:
      - scaledobjects
      - scaledobjects/status
      - scaledobjects/finalizers
      - scaledjobs
      - scaledjobs/status
      - scaledjobs/finalizers
      - triggerauthentications
      - triggerauthentications/status
      - clustertriggerauthentications
      - clustertriggerauthentications/status
    verbs: ["get", "list", "watch", "create", "update", "patch", "delete"]

  ## CloudEventSource custom resources
  - apiGroups: ["eventing.keda.sh"]
    resources:
      - cloudeventsources
      - cloudeventsources/status
      - clustercloudeventsources
      - clustercloudeventsources/status
    verbs: ["get", "list", "watch", "create", "update", "patch", "delete"]

  ## Scale subresource on workloads
  - apiGroups:
      - apps
      - ""
    resources:
      - deployments
      - replicasets
      - statefulsets
      - replicationcontrollers
    verbs: ["get", "list", "watch", "update", "patch"]
  - apiGroups: ["apps"]
    resources:
      - deployments/scale
      - replicasets/scale
      - statefulsets/scale
    verbs: ["get", "update", "patch"]
  - apiGroups: [""]
    resources:
      - replicationcontrollers/scale
    verbs: ["get", "update", "patch"]

  ## Custom/external workloads (KEDA ScaleTarget)
  - apiGroups: ["*"]
    resources: ["*/scale"]
    verbs: ["get", "update", "patch"]

  ## Batch resources (ScaledJob)
  - apiGroups: ["batch"]
    resources:
      - jobs
    verbs: ["get", "list", "watch", "create", "update", "patch", "delete"]

  ## CRD introspection (for dynamic validation)
  - apiGroups: ["apiextensions.k8s.io"]
    resources:
      - customresourcedefinitions
    verbs: ["get", "list", "watch"]

  ## Status subresource access
  - apiGroups: ["coordination.k8s.io"]
    resources:
      - leases
    verbs: ["get", "list", "watch", "create", "update", "patch", "delete"]
---
## ClusterRole for the KEDA Metrics API Server.
## Needs access to resource metrics for the External Metrics API.
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: {{ include "keda.fullname" . }}-metrics-apiserver
  labels:
    {{- include "keda.labels" . | nindent 4 }}
    app.kubernetes.io/component: metrics-apiserver
rules:
  - apiGroups: [""]
    resources:
      - namespaces
      - pods
      - nodes
      - nodes/stats
    verbs: ["get", "list", "watch"]

  - apiGroups: ["keda.sh"]
    resources:
      - scaledobjects
      - triggerauthentications
      - clustertriggerauthentications
    verbs: ["get", "list", "watch"]

  - apiGroups: ["external.metrics.k8s.io"]
    resources: ["*"]
    verbs: ["get", "list", "watch"]

  - apiGroups: ["metrics.k8s.io"]
    resources:
      - pods
      - nodes
    verbs: ["get", "list", "watch"]

  ## Secret access for TriggerAuthentication resolution
  - apiGroups: [""]
    resources: ["secrets"]
    verbs: ["get", "list", "watch"]
---
## ClusterRole for the KEDA Admission Webhooks component.
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: {{ include "keda.fullname" . }}-admission-webhooks
  labels:
    {{- include "keda.labels" . | nindent 4 }}
    app.kubernetes.io/component: admission-webhooks
rules:
  - apiGroups: ["keda.sh"]
    resources:
      - scaledobjects
      - scaledjobs
      - triggerauthentications
      - clustertriggerauthentications
    verbs: ["get", "list", "watch"]

  - apiGroups: ["admissionregistration.k8s.io"]
    resources:
      - validatingwebhookconfigurations
      - mutatingwebhookconfigurations
    verbs: ["get", "list", "watch", "create", "update", "patch", "delete"]
