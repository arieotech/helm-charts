apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "keda.fullname" . }}-operator
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "keda.labels" . | nindent 4 }}
    app.kubernetes.io/component: operator
spec:
  replicas: {{ .Values.operator.replicaCount }}
  selector:
    matchLabels:
      {{- include "keda.operatorSelectorLabels" . | nindent 6 }}
  template:
    metadata:
      labels:
        {{- include "keda.operatorSelectorLabels" . | nindent 8 }}
        {{- include "arieotech.istioAmbientLabels" . | nindent 8 }}
        {{- with .Values.podLabels }}
        {{- toYaml . | nindent 8 }}
        {{- end }}
      {{- include "keda.podAnnotations" . | nindent 6 }}
    spec:
      {{- with .Values.global.imagePullSecrets }}
      imagePullSecrets:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      serviceAccountName: {{ include "keda.operatorServiceAccountName" . }}
      automountServiceAccountToken: false
      securityContext:
        {{- include "arieotech.podSecurityContext" . | nindent 8 }}
      terminationGracePeriodSeconds: {{ .Values.terminationGracePeriodSeconds }}
      {{- with .Values.priorityClassName }}
      priorityClassName: {{ . }}
      {{- end }}
      {{- with .Values.initContainers }}
      initContainers:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      containers:
        - name: keda-operator
          image: {{ include "keda.componentImage" .Values.operator.image | quote }}
          imagePullPolicy: {{ .Values.operator.image.pullPolicy }}
          command:
            - /keda
          args:
            - --leader-elect
            - --zap-log-level={{ .Values.operator.logLevel }}
            - --zap-encoder={{ .Values.operator.logEncoder }}
            - --zap-time-encoding={{ .Values.operator.logTimeFormat }}
            {{- if not .Values.metrics.enabled }}
            ## Real flag for disabling Prometheus metrics (default true). The chart
            ## previously (wrongly) pointed --metrics-bind-address at :9666 — which
            ## collides with --metrics-service-bind-address's own default of :9666
            ## (the gRPC channel metrics-apiserver uses to resolve external metrics,
            ## unrelated to Prometheus and required regardless of this setting) —
            ## causing a bind: address already in use crash whenever metrics.enabled
            ## was true. Prometheus's own real default bind address is :8080.
            - --enable-prometheus-metrics=false
            {{- end }}
          env:
            - name: KEDA_HTTP_DEFAULT_TIMEOUT
              value: "3000"
            - name: KEDA_HTTP_MIN_TLS_VERSION
              value: "TLS12"
            ## Required — the operator calls os.LookupEnv("WATCH_NAMESPACE") directly
            ## (pkg/util.GetWatchNamespaces in kedacore/keda) and exits fatally if the
            ## var isn't present at all, even set to "". There is no --watch-namespace
            ## CLI flag; empty string means cluster-wide (Arieotech fix for upstream #5943
            ## is this env var, not a flag).
            - name: WATCH_NAMESPACE
              value: {{ .Values.operator.watchNamespace | quote }}
            ## Pod name used for leader election
            - name: POD_NAME
              valueFrom:
                fieldRef:
                  fieldPath: metadata.name
            - name: POD_NAMESPACE
              valueFrom:
                fieldRef:
                  fieldPath: metadata.namespace
            {{- if .Values.soc2.auditLogging.enabled }}
            - name: KEDA_OPERATOR_LOG_FORMAT
              value: "json"
            {{- end }}
            {{- with .Values.operator.extraEnv }}
            {{- toYaml . | nindent 12 }}
            {{- end }}
          ports:
            ## gRPC channel the Metrics API Server uses to resolve external metrics —
            ## the binary's own real default for --metrics-service-bind-address, always
            ## needed regardless of metrics.enabled (it is not a Prometheus concern).
            - name: grpc-metrics
              containerPort: 9666
              protocol: TCP
            ## --health-probe-bind-address's real default; the chart previously didn't
            ## set this flag but pointed probes at :8080, which doesn't match the
            ## binary's actual default of :8081.
            - name: health
              containerPort: 8081
              protocol: TCP
            {{- if .Values.metrics.enabled }}
            ## --metrics-bind-address's real default (Prometheus).
            - name: metrics
              containerPort: 8080
              protocol: TCP
            {{- end }}
          livenessProbe:
            httpGet:
              path: /healthz
              port: health
            initialDelaySeconds: 25
            periodSeconds: 10
            timeoutSeconds: 5
            failureThreshold: 3
          readinessProbe:
            httpGet:
              path: /readyz
              port: health
            initialDelaySeconds: 20
            periodSeconds: 3
            timeoutSeconds: 3
            failureThreshold: 3
          securityContext:
            {{- include "arieotech.containerSecurityContext" . | nindent 12 }}
          resources:
            {{- toYaml .Values.operator.resources | nindent 12 }}
          volumeMounts:
            - name: tmp
              mountPath: /tmp
            {{- include "arieotech.serviceAccountTokenVolumeMount" . | nindent 12 }}
            {{- with .Values.extraVolumeMounts }}
            {{- toYaml . | nindent 12 }}
            {{- end }}
        {{- with .Values.sidecars }}
        {{- toYaml . | nindent 8 }}
        {{- end }}
      volumes:
        - name: tmp
          emptyDir: {}
        {{- include "arieotech.serviceAccountTokenVolume" . | nindent 8 }}
        {{- with .Values.extraVolumes }}
        {{- toYaml . | nindent 8 }}
        {{- end }}
      {{- with .Values.nodeSelector }}
      nodeSelector:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.tolerations }}
      tolerations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.affinity }}
      affinity:
        {{- toYaml . | nindent 8 }}
      {{- else }}
      affinity:
        podAntiAffinity:
          preferredDuringSchedulingIgnoredDuringExecution:
            - weight: 100
              podAffinityTerm:
                topologyKey: kubernetes.io/hostname
                labelSelector:
                  matchLabels:
                    {{- include "keda.operatorSelectorLabels" . | nindent 20 }}
      {{- end }}
      {{- with .Values.topologySpreadConstraints }}
      topologySpreadConstraints:
        {{- range . }}
        - {{ toYaml . | nindent 10 | trim }}
          labelSelector:
            matchLabels:
              {{- include "keda.operatorSelectorLabels" $ | nindent 14 }}
        {{- end }}
      {{- end }}
