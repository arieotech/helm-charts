## Helm test: verify the KEDA operator and Metrics API Server health endpoints respond.
apiVersion: v1
kind: Pod
metadata:
  name: {{ printf "%s-test-connection" (include "keda.fullname" .) }}
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "keda.labels" . | nindent 4 }}
    app.kubernetes.io/component: test
  annotations:
    "helm.sh/hook": test
    "helm.sh/hook-delete-policy": before-hook-creation,hook-succeeded
spec:
  restartPolicy: Never
  ## Any of the 3 component ServiceAccounts works here — this pod only does HTTP health
  ## checks, no Kubernetes API calls, and automountServiceAccountToken is false anyway.
  serviceAccountName: {{ include "keda.operatorServiceAccountName" . }}
  automountServiceAccountToken: false
  securityContext:
    runAsNonRoot: true
    runAsUser: 65534
    seccompProfile:
      type: RuntimeDefault
  containers:
    - name: test-operator-health
      image: busybox:1.36.1
      securityContext:
        allowPrivilegeEscalation: false
        readOnlyRootFilesystem: true
        capabilities:
          drop:
            - ALL
      command:
        - sh
        - -c
        - |
          check() {
            name="$1"; url="$2"; shift 2
            i=0
            until wget -q --spider --timeout=10 "$@" "$url"; do
              i=$((i+1))
              if [ $i -ge 6 ]; then echo "FAIL: $name timed out after ~60s"; exit 1; fi
              echo "$name: attempt $i failed, retrying in 10s..."
              sleep 10
            done
            echo "$name: OK"
          }

          check "KEDA operator" \
            "http://{{ include "keda.fullname" . }}-operator.{{ .Release.Namespace }}.svc.cluster.local:8081/healthz"

          ## HTTPS: the adapter serves /healthz on its secure API port, not a separate
          ## plain-HTTP health port — see deployment-metrics-apiserver.yaml. The cert is
          ## self-signed by default, so certificate validation is skipped here (this is a
          ## liveness smoke test, not a security check — same as kubelet's own probe,
          ## which never validates certs for httpGet probes regardless of scheme).
          check "KEDA metrics API server" \
            "https://{{ include "keda.fullname" . }}-metrics-apiserver.{{ .Release.Namespace }}.svc.cluster.local:{{ .Values.metricsApiServer.port }}/healthz" \
            --no-check-certificate

          {{- if .Values.admissionWebhooks.enabled }}
          check "KEDA admission webhooks" \
            "http://{{ include "keda.fullname" . }}-admission-webhooks.{{ .Release.Namespace }}.svc.cluster.local:8081/healthz"
          {{- end }}

          echo "All KEDA health checks passed."
