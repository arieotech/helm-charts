## Three separate ServiceAccounts (one per component) instead of arieotech.serviceAccount
## (which renders a single shared account) — see the doc comment on the
## keda.*ServiceAccountName helpers in _helpers.tpl for why. When
## serviceAccount.name is explicitly set, all three keda.*ServiceAccountName helpers
## resolve to that same name (an intentional opt-out of the per-component split), so
## only one ServiceAccount is rendered here to avoid three manifests fighting over
## ownership of one identically-named object.
{{- if .Values.serviceAccount.create }}
apiVersion: v1
kind: ServiceAccount
metadata:
  name: {{ include "keda.operatorServiceAccountName" . }}
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "keda.labels" . | nindent 4 }}
    {{- if not .Values.serviceAccount.name }}
    app.kubernetes.io/component: operator
    {{- end }}
  {{- with .Values.serviceAccount.annotations }}
  annotations:
    {{- toYaml . | nindent 4 }}
  {{- end }}
automountServiceAccountToken: false
{{- if not .Values.serviceAccount.name }}
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: {{ include "keda.metricsServiceAccountName" . }}
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "keda.labels" . | nindent 4 }}
    app.kubernetes.io/component: metrics-apiserver
  {{- with .Values.serviceAccount.annotations }}
  annotations:
    {{- toYaml . | nindent 4 }}
  {{- end }}
automountServiceAccountToken: false
{{- if .Values.admissionWebhooks.enabled }}
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: {{ include "keda.webhooksServiceAccountName" . }}
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "keda.labels" . | nindent 4 }}
    app.kubernetes.io/component: admission-webhooks
  {{- with .Values.serviceAccount.annotations }}
  annotations:
    {{- toYaml . | nindent 4 }}
  {{- end }}
automountServiceAccountToken: false
{{- end }}
{{- end }}
{{- end }}
